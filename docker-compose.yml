services:
  postgres:
    image: postgres:16
    container_name: local-budgie-postgres
    environment:
      POSTGRES_DB: local-budgie-db
      POSTGRES_USER: foo
      POSTGRES_PASSWORD: bar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
